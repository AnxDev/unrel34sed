<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        keyframes: {
                            glitch: {
                                '0%, 85%, 100%': { transform: 'translate(0)', textShadow: '-2px 0 #22c55e, 2px 0 #a855f7' },
                                '88%': { transform: 'translate(-3px, 1px)', textShadow: '3px 0 #22c55e, -3px 0 #a855f7' },
                                '92%': { transform: 'translate(3px, -1px)', textShadow: '-3px 0 #22c55e, 3px 0 #a855f7' },
                                '96%': { transform: 'translate(-2px, -1px)', textShadow: '2px 0 #a855f7, -2px 0 #22c55e' },
                            }
                        },
                        animation: {
                            glitch: 'glitch 2.5s infinite linear',
                        }
                    }
                }
            }
</script>
    </head>
    <body class="h-screen w-screen overflow-hidden bg-neutral-950 text-white relative select-none flex items-center justify-center">
        <img class="fixed inset-0 w-full h-full object-cover scale-150 pointer-events-none transition-all duration-1000" id="bg" src="texture.gif">
        <header class="absolute top-8 left-1/2 -translate-x-1/2 z-20 text-center pointer-events-none">
            <h1 class="text-xl font-mono uppercase tracking-[0.35em] text-white/60 animate-glitch">Unrel34sed</h1>
        </header>
        <main class="relative h-screen w-screen flex flex-col relative z-10 items-center justify-center px-6 overflow-hidden">       
            <div id="cd_wrapper" class="w-96 h-96 transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)] cursor-pointer flex items-center justify-center">
                <canvas id="cd-cover" class="w-full h-full"></canvas> 
            </div>
                <div class="grid grid-rows-[0fr] opacity-0 transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)] w-full max-w-md" id="panel-expander">
                    <div class="overflow-hidden">
                        <div id="player-panel" class="w-full max-w-md flex flex-col gap-6  transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)]">
                            <div>
                                <div id="track-info" class="transition-all duration-200 ease-out">
                                    <h1 id="title" class="font-mono animate-pulse">titolo</h1>
                                    <p id="artist" class="font-mono">thasup</p>
                                </div>
                                <div id="progress-container" class="w-full h-1.5 bg-white/15 rounded-full transition-all duration-150 cursor-pointer">
                                    <div id="progress-bar" class="h-full w-0 bg-white rounded-full shadow-[0_0_12px_rgba(255,255,255,0.85), 0_0_25px_rgba(168,85,245,0.6)]"></div>
                                </div>
                                <div class="flex justify-between mt-1.5">
                                    <span class="text-xs font-mono text-white/50" id="current-time">0:00</span>
                                    <span class="text-xs font-mono text-white/50" id="total-time">4:00</span>
                                </div>
                                <div class="flex items-center justify-center gap-6 mt-4" id="controls">
                                    
                                    <button id="prev-btn" class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white/80 hover:text-white flex items-center justify-center transition-all duration-200 active:scale-90 cursor-pointer">
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                                        </svg>
                                    </button>

                                    
                                    <button id="play-btn" class="w-16 h-16 rounded-full bg-white text-neutral-950 hover:scale-105 active:scale-95 shadow-[0_0_25px_rgba(255,255,255,0.3)] flex items-center justify-center transition-all duration-200 cursor-pointer">
                                        <svg class="w-7 h-7 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M8 5v14l11-7z"/>
                                        </svg>
                                    </button>

                                    
                                    <button id="next-btn" class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white/80 hover:text-white flex items-center justify-center transition-all duration-200 active:scale-90 cursor-pointer">
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                    </div>
                </div>
            </div>
        </main>
        
        
        <script src="app.js" defer></script>
    </body>
</html>
